# See roles/pihole/meta/install.yml for schema reference.

display_name: "Paperless-NGX"
description: "Document OCR + tagging + search. Optional SSO via Nextcloud (see docs/SSO-Bootstrap.md)."

inventory_vars:
  - name: paperless_url
    type: computed
    template: "https://paperless.{{ caddy_domain }}"
  - name: paperless_secret_key
    type: secret
    generator: "openssl rand -hex 32"
    vault: true
  - name: paperless_db_password
    type: secret
    generator: "openssl rand -base64 24"
    vault: true
  - name: paperless_admin_password
    type: secret
    generator: "openssl rand -base64 24"
    vault: true
    # Bootstrap value used on first DB init. After that, the user owns
    # the live password via the paperless web UI (or `manage.py
    # changepassword admin`). Inventory may drift out of sync.
    user_facing: true

side_effects:
  caddy_reverse_proxy_services:
    - { subdomain: paperless, port: 8000, label: "Web UI" }  # label is a dashboard hint
  my_linux_users:
    paperless:
      uid: 1007
      gid: 1007

playbooks:
  - playbooks/paperless-ngx.yml
  - playbooks/caddy.yml
  - playbooks/dashboard.yml

on_remove:
  inventory_vars_to_clear:
    - paperless_url
    # paperless_secret_key only signs Django session cookies — rotating
    # it invalidates browser sessions but doesn't touch DB state.
    - paperless_secret_key
    # paperless_oidc_* deliberately not listed — if the operator has
    # wired SSO via the SSO-Bootstrap walkthrough, removing Paperless
    # leaves the (now-orphaned) OIDC client in Nextcloud and the
    # inventory keys for it. Operator removes those manually.
  inventory_vars_to_clear_on_purge:
    # Paired with paperless-db-data (postgres role + admin user record).
    # Without --purge the DB volume survives the remove, so the OLD
    # passwords are still baked into postgres and into the admin row.
    # Regenerating these on the next `add` would lock the operator
    # out of both DB-auth and the admin UI. --purge nukes the volume,
    # at which point regenerating is correct.
    - paperless_db_password
    - paperless_admin_password
  volumes_to_preserve_unless_purge:
    - paperless-data
    - paperless-db-data
    - paperless-redis-data
    - paperless-media
    - paperless-consume
    - paperless-export
