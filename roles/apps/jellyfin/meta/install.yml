# See roles/pihole/meta/install.yml for schema reference.

display_name: "Jellyfin"
description: "Media server for movies, TV and music"

inventory_vars:
  - name: jellyfin_admin_password
    type: secret
    generator: "openssl rand -base64 24"
    vault: true
    # Bootstrap value used on first Jellyfin start (seeded via the
    # role's postinstall). After that, the user owns the live password
    # via the Jellyfin web UI. Inventory may drift out of sync.
    user_facing: true

side_effects:
  caddy_reverse_proxy_services:
    - { subdomain: jellyfin, port: 8096, label: "Web UI" }  # label is a dashboard hint
  my_linux_users:
    jellyfin:
      uid: 1012
      gid: 1012

playbooks:
  - playbooks/jellyfin.yml
  - playbooks/caddy.yml
  - playbooks/dashboard.yml

on_remove:
  inventory_vars_to_clear: []
  # Paired with systemd-jellyfin-config (preserved by default), which
  # holds jellyfin.db — the SQLite with the admin user row. Regenerating
  # this without --purge would lock the operator out of the UI on the
  # next add. --purge nukes the config volume, at which point a fresh
  # password makes sense.
  inventory_vars_to_clear_on_purge:
    - jellyfin_admin_password
  volumes_to_preserve_unless_purge:
    - systemd-jellyfin-config
    - systemd-jellyfin-cache
    - systemd-jellyfin-media
