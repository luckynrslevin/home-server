---
# Jellyfin first-run automation: create admin user, set locale, register
# the standard media libraries, all via Jellyfin's REST API.
#
# Idempotent: every step polls existing state (wizard complete? library
# already present?) before issuing writes. Re-running site.yml is safe.
#
# All API calls go to http://127.0.0.1:8096 — the container uses
# Network=host so the host loopback hits Jellyfin directly.

- name: Wait for Jellyfin web service to come up
  ansible.builtin.uri:
    url: "http://127.0.0.1:8096/health"
    status_code: 200
    return_content: true
  register: _jellyfin_health
  retries: 30
  delay: 5
  until: _jellyfin_health.status == 200 and 'Healthy' in (_jellyfin_health.content | default(''))

# Pre-create media library subdirectories inside the running
# container. Done here (after the health wait) rather than via
# podman_quadlet_volumes_files_to_stage which would require a real
# source dir on the control host.
- name: Pre-create media library subdirectories # noqa: no-changed-when
  become: true
  ansible.builtin.command:
    cmd: >-
      sudo -iu jellyfin podman exec jellyfin
      mkdir -p {{ item.path | quote }}
  loop: "{{ jellyfin_libraries }}"
  loop_control:
    label: "{{ item.path }}"
  changed_when: false

# --------------------------------------------------------------------------
# Wizard state probe
# --------------------------------------------------------------------------
# /System/Info/Public is unauthenticated and reports the canonical
# StartupWizardCompleted flag. Older code probed /Startup/User but
# newer Jellyfin always requires auth there, making the response
# code ambiguous as a wizard-state signal.

- name: Probe wizard state
  ansible.builtin.uri:
    url: "http://127.0.0.1:8096/System/Info/Public"
    method: GET
    status_code: 200
    return_content: true
  register: _jellyfin_wizard_probe

- name: Set wizard_incomplete fact
  ansible.builtin.set_fact:
    _jellyfin_wizard_incomplete: "{{ not (_jellyfin_wizard_probe.json.StartupWizardCompleted | default(true)) }}"

# --------------------------------------------------------------------------
# Wizard walkthrough — only when wizard is still incomplete
# --------------------------------------------------------------------------
- name: Configure metadata locale
  ansible.builtin.uri:
    url: "http://127.0.0.1:8096/Startup/Configuration"
    method: POST
    body_format: json
    body:
      UICulture: "{{ jellyfin_metadata_language }}"
      MetadataCountryCode: "{{ jellyfin_metadata_country }}"
      PreferredMetadataLanguage: "{{ jellyfin_metadata_language }}"
    status_code: [200, 204]
  when: _jellyfin_wizard_incomplete

# Jellyfin seeds the default "root" user asynchronously after the
# Configuration POST returns. Polling GET /Startup/User until it
# returns 200 (instead of the 500 from `Users.First()` on an empty
# collection) avoids a race where the next POST 500s.
- name: Wait for Jellyfin default user to be seeded
  ansible.builtin.uri:
    url: "http://127.0.0.1:8096/Startup/User"
    method: GET
    status_code: 200
    return_content: false
  register: _jellyfin_default_user_probe
  retries: 30
  delay: 2
  until: _jellyfin_default_user_probe.status == 200
  when: _jellyfin_wizard_incomplete

- name: Create admin user via wizard
  ansible.builtin.uri:
    url: "http://127.0.0.1:8096/Startup/User"
    method: POST
    body_format: json
    body:
      Name: "{{ jellyfin_admin_user }}"
      Password: "{{ jellyfin_admin_password }}"
    status_code: [200, 204]
  when: _jellyfin_wizard_incomplete

- name: Configure remote-access settings (Caddy fronts; UPnP off)
  ansible.builtin.uri:
    url: "http://127.0.0.1:8096/Startup/RemoteAccess"
    method: POST
    body_format: json
    body:
      EnableRemoteAccess: true
      EnableAutomaticPortMapping: false
    status_code: [200, 204]
  when: _jellyfin_wizard_incomplete

- name: Mark wizard complete
  ansible.builtin.uri:
    url: "http://127.0.0.1:8096/Startup/Complete"
    method: POST
    status_code: [200, 204]
  when: _jellyfin_wizard_incomplete

# --------------------------------------------------------------------------
# Authenticate as admin to drive library setup (post-wizard auth required).
#
# Jellyfin 10.11 quirk: POST /Startup/User accepts a `Password` field
# but doesn't reliably persist it — the user ends up with no password
# even though the API returned 200. So we:
#   1. Try the inventory password first (works on rebuilds where the
#      password was previously set via the explicit step below).
#   2. Fall back to empty password (the actual post-wizard state on
#      a fresh install).
#   3. If we got in via the empty-password fallback, immediately set
#      the inventory password via /Users/{id}/Password so future
#      auth attempts work and subsequent re-runs go through the
#      happy path.
# --------------------------------------------------------------------------
- name: Authenticate as admin (try inventory password)
  ansible.builtin.uri:
    url: "http://127.0.0.1:8096/Users/AuthenticateByName"
    method: POST
    body_format: json
    body:
      Username: "{{ jellyfin_admin_user }}"
      Pw: "{{ jellyfin_admin_password }}"
    headers:
      Authorization: 'MediaBrowser Client="ansible-postinstall", Device="home-server", DeviceId="home-server-postinstall", Version="1.0"'
    status_code: [200, 401]
    return_content: true
  register: _jellyfin_auth_first
  no_log: true

- name: Authenticate as admin (empty password fallback — fresh 10.11 wizard)
  ansible.builtin.uri:
    url: "http://127.0.0.1:8096/Users/AuthenticateByName"
    method: POST
    body_format: json
    body:
      Username: "{{ jellyfin_admin_user }}"
      Pw: ""
    headers:
      Authorization: 'MediaBrowser Client="ansible-postinstall", Device="home-server", DeviceId="home-server-postinstall", Version="1.0"'
    status_code: 200
    return_content: true
  register: _jellyfin_auth_fallback
  when: _jellyfin_auth_first.status == 401
  no_log: true

- name: Select the successful auth response
  ansible.builtin.set_fact:
    _jellyfin_auth: "{{ _jellyfin_auth_fallback if _jellyfin_auth_first.status == 401 else _jellyfin_auth_first }}"
  no_log: true

- name: Set admin password to inventory value (only if fallback was used)
  ansible.builtin.uri:
    url: "http://127.0.0.1:8096/Users/{{ _jellyfin_auth.json.User.Id }}/Password"
    method: POST
    body_format: json
    body:
      CurrentPw: ""
      NewPw: "{{ jellyfin_admin_password }}"
    headers:
      Authorization: 'MediaBrowser Token="{{ _jellyfin_auth.json.AccessToken }}"'
    status_code: [200, 204]
  when: _jellyfin_auth_first.status == 401
  no_log: true

- name: Cache admin access token
  ansible.builtin.set_fact:
    _jellyfin_token: "{{ _jellyfin_auth.json.AccessToken }}"
  no_log: true

# --------------------------------------------------------------------------
# Libraries — list current, then create any missing ones.
# --------------------------------------------------------------------------
- name: List existing libraries
  ansible.builtin.uri:
    url: "http://127.0.0.1:8096/Library/VirtualFolders"
    method: GET
    headers:
      Authorization: 'MediaBrowser Token="{{ _jellyfin_token }}"'
    status_code: 200
    return_content: true
  register: _jellyfin_existing_libs
  no_log: true

- name: Build set of existing library names
  ansible.builtin.set_fact:
    _jellyfin_existing_lib_names: "{{ _jellyfin_existing_libs.json | map(attribute='Name') | list }}"

- name: Create missing libraries
  ansible.builtin.uri:
    url: "http://127.0.0.1:8096/Library/VirtualFolders?name={{ item.name | urlencode }}&collectionType={{ item.type }}&refreshLibrary=false"
    method: POST
    body_format: json
    body:
      LibraryOptions:
        PathInfos:
          - { Path: "{{ item.path }}" }
    headers:
      Authorization: 'MediaBrowser Token="{{ _jellyfin_token }}"'
    status_code: [200, 204]
  loop: "{{ jellyfin_libraries }}"
  loop_control:
    label: "{{ item.name }} ({{ item.type }} -> {{ item.path }})"
  when: item.name not in _jellyfin_existing_lib_names
  register: _jellyfin_libs_changed

- name: Trigger one library scan if anything changed # noqa: no-handler
  ansible.builtin.uri:
    url: "http://127.0.0.1:8096/Library/Refresh"
    method: POST
    headers:
      Authorization: 'MediaBrowser Token="{{ _jellyfin_token }}"'
    status_code: [200, 204]
  when: _jellyfin_libs_changed.changed | default(false)
