---

- name: Ensure rootless user group exists
  ansible.builtin.group:
    name: entephoto
    gid: "{{ my_linux_users.entephoto.gid }}"
    state: present

- name: Ensure rootless user exists
  ansible.builtin.user:
    name: entephoto
    state: present
    uid: "{{ my_linux_users.entephoto.uid }}"
    group: entephoto
    create_home: true

- name: Enable linger for rootless user
  become: true
  ansible.builtin.command:
    cmd: "loginctl enable-linger entephoto"
  changed_when: false

- name: Enable podman auto-update timer for rootless user # noqa: no-changed-when
  become: true
  ansible.builtin.command:
    cmd: >
      sudo -u entephoto XDG_RUNTIME_DIR=/run/user/{{ my_linux_users.entephoto.uid }}
      DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ my_linux_users.entephoto.uid }}/bus
      systemctl --user enable --now podman-auto-update.timer
  changed_when: false

- name: Save current role path
  ansible.builtin.set_fact:
    entephoto_role_path: "{{ role_path }}"

# Chicken-and-egg: podman_quadlet stages museum.yaml from a template
# that references Garage's access key. On a re-deploy the key already
# exists in the sidecar (created by garage-bootstrap.yml on a prior
# run) — pre-load it here so the initial render uses real creds.
# On a true greenfield deploy the sidecar is absent, the placeholder
# defaults stand in, and garage-bootstrap + the post-stage re-render
# correct museum.yaml before any real traffic.
- name: Stat Garage access key sidecar
  become: true
  become_user: entephoto
  ansible.builtin.stat:
    path: /home/entephoto/.garage-museum-key.json
  register: _entephoto_pre_sidecar

- name: Load existing Garage access key from sidecar
  become: true
  become_user: entephoto
  ansible.builtin.slurp:
    src: /home/entephoto/.garage-museum-key.json
  register: _entephoto_pre_sidecar_slurp
  when: _entephoto_pre_sidecar.stat.exists
  no_log: true

- name: Expose pre-loaded Garage key as facts
  ansible.builtin.set_fact:
    entephoto_s3_access_key_id: "{{ (_entephoto_pre_sidecar_slurp.content | b64decode | from_json).key_id }}"
    entephoto_s3_secret_access_key: "{{ (_entephoto_pre_sidecar_slurp.content | b64decode | from_json).secret_key }}"
  when: _entephoto_pre_sidecar.stat.exists
  no_log: true

# Deploy Ente Photos stack as a rootless Podman pod.
# The pod contains postgres, garage, museum (API) and web (frontend) sharing
# one network namespace — so museum can reach garage and postgres via
# localhost without a socat bridge (which the upstream docker-compose needs).
- name: Deploy entephoto pod using podman_quadlet
  ansible.builtin.include_role:
    name: luckynrslevin.podman_quadlet
  vars:
    podman_quadlet_app_name: "entephoto-pod"
    podman_quadlet_rootless_user_name: entephoto
    podman_quadlet_files_templates_src_path: "{{ entephoto_role_path }}"
    podman_quadlet_file_names:
      - entephoto.pod.j2
      - entephoto.network
      - entephoto-postgres.container.j2
      - entephoto-garage.container.j2
      - entephoto-museum.container.j2
      - entephoto-web.container.j2
      - entephoto-postgres-data.volume
      - entephoto-garage-data.volume
      - entephoto-garage-meta.volume
      - entephoto-garage-config.volume
      - entephoto-museum-config.volume
    podman_quadlet_volumes_files_to_stage:
      - name: entephoto-museum-config
        files:
          - src: museum.yaml.j2
            mode: "0600"
      - name: entephoto-garage-config
        files:
          - src: garage.toml.j2
            mode: "0600"
    # All Ente surfaces are reverse-proxied by Caddy at
    # https://photos.<caddy_domain>, photos-api, photos-s3, accounts, cast,
    # auth, etc. Direct LAN openings (8080, 3900, 3000-3008) intentionally
    # not exposed.

# --------------------------------------------------------------------------
# Garage bootstrap
#
# Assigns the single-node layout, creates the three buckets Ente expects
# (b2-eu-cen, wasabi-eu-central-2-v3, scw-eu-fr-v3), generates an access
# key (museum's S3 credentials), and grants it read/write on each bucket.
# Idempotent — re-running picks up existing layout/buckets/keys.
#
# Must run BEFORE museum.yaml is rendered, because the access key created
# here populates entephoto_s3_access_key_id / entephoto_s3_secret_access_key
# inside that template.
# --------------------------------------------------------------------------
- name: Bootstrap Garage (layout, buckets, access key)
  ansible.builtin.include_tasks: garage-bootstrap.yml

# podman_quadlet stages museum.yaml into the entephoto-museum-config
# volume on FIRST deploy only — subsequent ansible runs with changed
# inventory (e.g. an updated entephoto_s3_endpoint, or the access key
# materialized by garage-bootstrap above) don't re-render it, leaving
# museum.yaml out of sync.
- name: Re-render museum.yaml + bounce museum on drift
  ansible.builtin.include_tasks: render-museum-config.yml

- name: Register backup manifest
  ansible.builtin.set_fact:
    _backup_manifests: >-
      {{ _backup_manifests | default([]) +
         [backup_manifest | combine({'_role_name': role_name})] }}
  when: backup_manifest is defined
