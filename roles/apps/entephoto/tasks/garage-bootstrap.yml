---
# Garage bootstrap. Runs against the entephoto-garage container after the
# pod is up. All steps are idempotent — safe to re-run on every deploy.

# `podman exec ... /garage status` doubles as the readiness probe — it
# only returns 0 once the gossip layer is up. Using a host-level
# wait_for on 3900 would fail until the pod re-publishes that port,
# which doesn't happen until the cutover.
- name: Wait for Garage to be ready
  become: true
  become_user: entephoto
  ansible.builtin.command:
    cmd: podman exec entephoto-garage /garage status
  register: _garage_status
  retries: 30
  delay: 2
  until: _garage_status.rc == 0
  changed_when: false

- name: Parse node ID and current layout state
  ansible.builtin.set_fact:
    # `garage status` prints a table with the node ID as the first column
    # of the first data row under "HEALTHY NODES".
    _garage_node_id: >-
      {{ _garage_status.stdout_lines
         | select('match', '^[0-9a-f]{16,}')
         | first
         | regex_search('^[0-9a-f]+') }}
    _garage_layout_assigned: "{{ 'NO ROLE ASSIGNED' not in _garage_status.stdout }}"

- name: Assign single-node layout
  become: true
  become_user: entephoto
  ansible.builtin.shell: |
    set -e
    podman exec entephoto-garage /garage layout assign \
      -z home -c 1T {{ _garage_node_id }}
    podman exec entephoto-garage /garage layout apply --version 1
  changed_when: true
  when: not _garage_layout_assigned

# Bucket creation: `garage bucket create` errors on the second call.
# Check + create rather than swallowing errors blindly.
- name: List existing buckets
  become: true
  become_user: entephoto
  ansible.builtin.command:
    cmd: podman exec entephoto-garage /garage bucket list
  register: _garage_bucket_list
  changed_when: false

- name: Create Ente buckets
  become: true
  become_user: entephoto
  ansible.builtin.command:
    cmd: "podman exec entephoto-garage /garage bucket create {{ item }}"
  loop:
    - b2-eu-cen
    - wasabi-eu-central-2-v3
    - scw-eu-fr-v3
  when: item not in _garage_bucket_list.stdout
  changed_when: true

# Access key handling.
#
# `garage key create` prints the secret exactly once (at creation time).
# Persist id+secret to a root-owned file in entephoto's home so re-runs
# can read it back without regenerating. Garage itself stores the key
# in its metadata DB; we just need a sidecar so ansible can template it
# into museum.yaml.
- name: Check for persisted Garage access key
  become: true
  become_user: entephoto
  ansible.builtin.stat:
    path: /home/entephoto/.garage-museum-key.json
  register: _garage_key_file

- name: Create museum access key and persist sidecar
  # Garage prints `Key ID:` and `Secret key:` mixed in with netapp INFO
  # logs across stdout+stderr; grep over the combined stream is sturdier
  # than ansible regex_search on a single channel.
  become: true
  become_user: entephoto
  ansible.builtin.shell: |
    set -euo pipefail
    OUT=$(podman exec entephoto-garage /garage key create entephoto-museum 2>&1)
    KEY_ID=$(printf '%s\n' "$OUT" | grep -oP 'Key ID:\s+\K\S+')
    SECRET=$(printf '%s\n' "$OUT" | grep -oP 'Secret key:\s+\K\S+')
    if [ -z "$KEY_ID" ] || [ -z "$SECRET" ]; then
      echo "Failed to parse Key ID / Secret key from garage output:" >&2
      echo "$OUT" >&2
      exit 1
    fi
    umask 077
    printf '{"key_id":"%s","secret_key":"%s"}\n' "$KEY_ID" "$SECRET" \
      > /home/entephoto/.garage-museum-key.json
  args:
    executable: /bin/bash
  changed_when: true
  no_log: true
  when: not _garage_key_file.stat.exists

- name: Load persisted Garage access key
  become: true
  become_user: entephoto
  ansible.builtin.slurp:
    src: /home/entephoto/.garage-museum-key.json
  register: _garage_key_slurp
  no_log: true

- name: Expose access key as facts for museum.yaml
  ansible.builtin.set_fact:
    entephoto_s3_access_key_id: "{{ (_garage_key_slurp.content | b64decode | from_json).key_id }}"
    entephoto_s3_secret_access_key: "{{ (_garage_key_slurp.content | b64decode | from_json).secret_key }}"
  no_log: true

- name: Grant museum key read/write on each bucket
  become: true
  become_user: entephoto
  ansible.builtin.command:
    cmd: >
      podman exec entephoto-garage /garage bucket allow
      --read --write --owner
      --key entephoto-museum {{ item }}
  loop:
    - b2-eu-cen
    - wasabi-eu-central-2-v3
    - scw-eu-fr-v3
  changed_when: false

# Browser uploads send a CORS preflight OPTIONS before the actual PUT.
# Garage requires explicit per-bucket CORS rules. The Garage CLI has no
# CORS subcommand, so set rules via the S3 API using awscli in a
# one-shot container joined to the pod.
- name: Apply CORS rules to each bucket
  become: true
  become_user: entephoto
  ansible.builtin.shell: |
    set -euo pipefail
    podman run --rm --pod entephoto \
      -e AWS_ACCESS_KEY_ID={{ entephoto_s3_access_key_id }} \
      -e AWS_SECRET_ACCESS_KEY={{ entephoto_s3_secret_access_key }} \
      -e AWS_DEFAULT_REGION=eu-central-2 \
      docker.io/amazon/aws-cli:latest \
      --endpoint-url=http://127.0.0.1:3900 \
      s3api put-bucket-cors --bucket {{ item }} \
      --cors-configuration '{"CORSRules":[{"AllowedHeaders":["*"],"AllowedMethods":["GET","PUT","HEAD","POST","DELETE"],"AllowedOrigins":["*"],"ExposeHeaders":["ETag"]}]}'
  args:
    executable: /bin/bash
  loop:
    - b2-eu-cen
    - wasabi-eu-central-2-v3
    - scw-eu-fr-v3
  changed_when: false
  no_log: true
