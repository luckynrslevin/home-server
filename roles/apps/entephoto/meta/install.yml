# See roles/pihole/meta/install.yml for schema reference.

display_name: "Ente Photos"
description: "Self-hosted end-to-end encrypted photo storage (server side of the Ente apps)"

inventory_vars:
  - name: entephoto_db_password
    type: secret
    generator: "openssl rand -base64 24"
    vault: true
  - name: entephoto_garage_rpc_secret
    type: secret
    generator: "openssl rand -hex 32"
    vault: true
  - name: entephoto_garage_admin_token
    type: secret
    generator: "openssl rand -base64 32"
    vault: true
  - name: entephoto_encryption_key
    type: secret
    generator: "openssl rand -base64 32"
    vault: true
  - name: entephoto_hash_key
    type: secret
    generator: "openssl rand -base64 64 | tr -d '\n'"
    vault: true
  - name: entephoto_jwt_secret
    type: secret
    generator: "openssl rand -hex 32"
    vault: true
  - name: entephoto_api_url
    type: computed
    template: "https://photos-api.{{ caddy_domain }}"
  - name: entephoto_photos_url
    type: computed
    template: "https://photos.{{ caddy_domain }}"
  - name: entephoto_s3_endpoint
    type: computed
    template: "photos-s3.{{ caddy_domain }}"
  - name: entephoto_s3_host
    type: computed
    template: "photos-s3.{{ caddy_domain }}"
  - name: entephoto_s3_local_buckets
    type: literal
    value: false  # flips Ente's presigned URLs to https://

side_effects:
  caddy_reverse_proxy_services:
    # `path` / `label` / `hidden` are dashboard hints — caddy ignores them.
    # hidden: true keeps the caddy route but hides the link from the
    # dashboard. accounts/cast/auth/photos-s3 are internal Ente
    # backplanes that Caddy must proxy but the operator doesn't browse.
    - { subdomain: photos, port: 3000, label: "Photos" }
    - { subdomain: accounts, port: 3001, hidden: true }
    - { subdomain: cast, port: 3002, hidden: true }
    - { subdomain: auth, port: 3003, hidden: true }
    - { subdomain: photos-api, port: 8080, path: /ping, label: "API" }
    - { subdomain: photos-s3, port: 3900, hidden: true }
  my_linux_users:
    entephoto:
      uid: 1008
      gid: 1008

playbooks:
  - playbooks/entephoto.yml
  - playbooks/caddy.yml
  - playbooks/dashboard.yml

on_remove:
  inventory_vars_to_clear:
    # Derived URLs / endpoint values — safely re-rendered from
    # caddy_domain on the next add.
    - entephoto_api_url
    - entephoto_photos_url
    - entephoto_s3_endpoint
    - entephoto_s3_host
    - entephoto_s3_local_buckets
  # Paired with preserved-by-default state:
  #   db_password          ↔ entephoto-postgres-data (postgres role)
  #   garage_rpc_secret    ↔ entephoto-garage-meta (cluster identity)
  #   garage_admin_token   ↔ Garage admin auth-list (set on first init)
  #   encryption/hash/jwt  ↔ entephoto-postgres-data — these sign and
  #                          decrypt rows already written to the museum
  #                          DB; rotating without --purge silently
  #                          breaks every existing user.
  # All only safe to regenerate when the matching volumes are also
  # being purged.
  inventory_vars_to_clear_on_purge:
    - entephoto_db_password
    - entephoto_garage_rpc_secret
    - entephoto_garage_admin_token
    - entephoto_encryption_key
    - entephoto_hash_key
    - entephoto_jwt_secret
  volumes_to_preserve_unless_purge:
    - entephoto-postgres-data
    - entephoto-garage-data
    - entephoto-garage-meta
    - entephoto-museum-config
