# See roles/pihole/meta/install.yml for schema reference.

display_name: "Nextcloud"
description: "Files + contacts; also acts as OIDC identity provider for other apps (e.g. Paperless, see docs/SSO-Bootstrap.md)"

inventory_vars:
  - name: nextcloud_admin_password
    type: secret
    generator: "openssl rand -base64 24"
    vault: true
  - name: nextcloud_db_password
    type: secret
    generator: "openssl rand -base64 24"
    vault: true

side_effects:
  caddy_reverse_proxy_services:
    - { subdomain: cloud, port: 8090, label: "Web UI" }  # label is a dashboard hint
  my_linux_users:
    nextcloud:
      uid: 1015
      gid: 1015

playbooks:
  - playbooks/nextcloud.yml
  - playbooks/caddy.yml
  - playbooks/dashboard.yml

on_remove:
  inventory_vars_to_clear: []
  # Both passwords are paired with preserved-by-default state:
  # nextcloud-postgres-data holds the postgres role for the DB
  # password and the user record (where the admin password hash
  # lives). Regenerating these on the next `add` while the volume
  # survives causes DB-auth failure on nextcloud ↔ postgres and
  # locks the operator out of the admin UI. --purge nukes the
  # volume, at which point regenerating is correct.
  inventory_vars_to_clear_on_purge:
    - nextcloud_admin_password
    - nextcloud_db_password
  volumes_to_preserve_unless_purge:
    - nextcloud-config
    - nextcloud-data
    - nextcloud-html
    - nextcloud-postgres-data
    - nextcloud-redis-data
