# See roles/pihole/meta/install.yml for schema reference.

display_name: "Ente Photos export"
description: "Daily decrypted export of Ente photos + Google-Takeout-style sidecars to a NAS NFS share"

# Operator-supplied Ente account credentials. Vault-encrypted into
# inventory so the first-run `ente account add` can run unattended.
#
# Security trade-off: the account password protects the E2E encryption
# key. Storing it in vault means a vault.pw compromise also exposes
# the photos. Acceptable for the project's typical threat model (vault.pw
# on a USB / in a password manager off-host); recoverable later via
# `homeserver.sh secret entephoto_export_account_password`.
inventory_vars:
  - name: entephoto_export_account_email
    type: secret_prompt
    prompt: "Ente account email"
    mask: false
    vault: true
  - name: entephoto_export_account_password
    type: secret_prompt
    prompt: "Ente account password"
    vault: true
    confirm: true

# Side-effect: the rootless service user. Reuses the same UID/GID as
# the entephoto stack so the two roles cohabit cleanly when both are
# deployed (the export only needs read access to the museum API, not
# direct DB or MinIO access — the same uid is just hygiene).
side_effects:
  my_linux_users:
    entephoto:
      uid: 1008
      gid: 1008

playbooks:
  - playbooks/entephoto-export.yml

on_remove:
  inventory_vars_to_clear:
    - entephoto_export_account_email
    - entephoto_export_account_password
  # The state volume holds CLI auth + sync cursor. Keep it on remove
  # so re-adding the role resumes incremental exports without a fresh
  # full sync (and without re-doing `account add`).
  volumes_to_preserve_unless_purge:
    - entephoto-export-state
