---

- name: Ensure rootless user group exists
  ansible.builtin.group:
    name: jellyfin
    gid: "{{ my_linux_users.jellyfin.gid }}"
    state: present

- name: Ensure rootless user exists
  ansible.builtin.user:
    name: jellyfin
    state: present
    uid: "{{ my_linux_users.jellyfin.uid }}"
    group: jellyfin
    create_home: true

- name: Enable linger for rootless user
  become: true
  ansible.builtin.command:
    cmd: "loginctl enable-linger jellyfin"
  changed_when: false

- name: Enable podman auto-update timer for rootless user # noqa: no-changed-when
  become: true
  ansible.builtin.command:
    cmd: >
      sudo -u jellyfin XDG_RUNTIME_DIR=/run/user/{{ my_linux_users.jellyfin.uid }}
      DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ my_linux_users.jellyfin.uid }}/bus
      systemctl --user enable --now podman-auto-update.timer
  changed_when: false

- name: Save current role path
  ansible.builtin.set_fact:
    jellyfin_role_path: "{{ role_path }}"

# NFS-backed media mounts on the host. Persistent via fstab so they
# come up at boot before the rootless user systemd starts the
# container. Read-only by default — see `jellyfin_nas_mounts` in
# defaults for the var shape.
- name: Ensure NFS mountpoints exist on host
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "0755"
    setype: container_file_t
  loop: "{{ jellyfin_nas_mounts }}"
  loop_control:
    label: "{{ item.path }}"

- name: Mount NFS shares for Jellyfin
  become: true
  ansible.posix.mount:
    src: "{{ item.src }}"
    path: "{{ item.path }}"
    fstype: nfs
    opts: "{{ item.opts | default('ro,noatime,vers=4,_netdev') }}"
    state: mounted
  loop: "{{ jellyfin_nas_mounts }}"
  loop_control:
    label: "{{ item.src }} -> {{ item.path }}"

- name: Deploy jellyfin container using podman_quadlet
  ansible.builtin.include_role:
    name: luckynrslevin.podman_quadlet
  vars:
    podman_quadlet_app_name: "jellyfin"
    podman_quadlet_rootless_user_name: jellyfin
    podman_quadlet_files_templates_src_path: "{{ jellyfin_role_path }}"
    podman_quadlet_file_names:
      - jellyfin.container.j2
      - jellyfin-config.volume
      - jellyfin-cache.volume
      - jellyfin-media.volume
    # Jellyfin web UI is reverse-proxied by Caddy at
    # https://jellyfin.<caddy_domain>. Direct LAN access on 8096 is
    # intentionally not exposed (Caddy is mandatory in this project).

- name: Run first-run postinstall (wizard + libraries)
  ansible.builtin.import_tasks: postinstall.yml
  when: jellyfin_admin_password | length > 0

- name: Register backup manifest
  ansible.builtin.set_fact:
    _backup_manifests: >-
      {{ _backup_manifests | default([]) +
         [backup_manifest | combine({'_role_name': role_name})] }}
  when: backup_manifest is defined
