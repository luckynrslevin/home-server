# Container image — custom Caddy build with deSEC + Cloudflare +
# Hetzner DNS-01 plugins compiled in. See ../caddy-image/ for the
# Dockerfile + GitHub Actions workflow that publishes this tag.
caddy_image: "ghcr.io/luckynrslevin/caddy-acme:latest"

# Caddy listen ports. With os-base lowering
# net.ipv4.ip_unprivileged_port_start to 80, Caddy (rootless via
# webproxy) binds these directly — no firewall NAT, and pod-to-host
# traffic from other rootless containers reaches Caddy on the
# canonical ports, so OIDC issuers / S3 endpoints / etc. don't need
# `:9443` warts in their inventory URLs.
caddy_listen_port: 80
caddy_listen_port_https: 443

# Domain name for the server (e.g. "myhome.dedyn.io"). Required —
# every reverse-proxy subdomain hangs off this. site.yml asserts it
# at the top of the play.
caddy_domain: ""

# Reverse proxy service definitions. Each entry creates a subdomain
# route: <subdomain>.<caddy_domain> → localhost:<port>.
#
# Example:
#   caddy_reverse_proxy_services:
#     - { subdomain: pihole, port: 8443, proto: https }
#     - { subdomain: syncthing, port: 8384, proto: https }
#     - { subdomain: photos, port: 3000 }
#     - { subdomain: paperless, port: 8000 }
caddy_reverse_proxy_services: []

# ACME provider for issuing real Let's Encrypt certificates via the
# DNS-01 challenge. Required — the role asserts it. One of:
#
#   "desec"      — Free *.dedyn.io subdomain at deSEC (recommended).
#   "cloudflare" — BYO domain hosted at Cloudflare DNS.
#   "hetzner"    — BYO domain hosted at Hetzner DNS.
#
# All three plugins are bundled in the custom Caddy image
# (ghcr.io/luckynrslevin/caddy-acme); switching is just an inventory
# change.
caddy_acme_provider: ""

# For provider == "desec": the dedyn.io subdomain (without the
# .dedyn.io suffix). Caddy issues one cert per name —
# <caddy_acme_subdomain>.dedyn.io for the apex plus
# <subdomain>.<caddy_acme_subdomain>.dedyn.io for each
# caddy_reverse_proxy_services entry.
caddy_acme_subdomain: ""

# For provider == "cloudflare" / "hetzner": the BYO apex zone
# (e.g. "example.com"). Caddy issues one cert per name —
# <caddy_acme_zone> for the apex plus <subdomain>.<caddy_acme_zone>
# for each caddy_reverse_proxy_services entry.
caddy_acme_zone: ""

# API token for the chosen DNS provider. Vault-encrypt this in
# host_vars. Scope to the single zone / single record type when the
# provider supports it.
caddy_acme_token: ""

# ACME directory URL. Default = empty → Caddy uses Let's Encrypt
# production. Set to the staging URL on test boxes to dodge LE's
# 5-duplicate-cert-per-week rate limit while iterating:
#
#   caddy_acme_ca: "https://acme-staging-v02.api.letsencrypt.org/directory"
#
# Staging certs are signed by a fake CA (browsers will warn), so
# only use this on hosts where you're testing the cert pipeline
# itself, not for any real traffic. Switch back to "" for prod.
caddy_acme_ca: ""

# Backup manifest — consumed by the backup role and restore playbook.
# Only caddy-data is backed up: it holds the LE-issued certs (one per
# site name — apex + each subdomain) and the ACME account key.
# Preserving it across an OS reinstall lets `restore.yml` skip a fresh
# issuance entirely (and dodges LE's 50-certs-per-week-per-domain rate
# limit on aggressive rebuilds). caddy-config is runtime state,
# caddy-etc is regenerated from the template — both rebuild from
# scratch on every deploy.
backup_manifest:
  service_user: webproxy
  service_unit: caddy
  volumes:
    - { name: caddy-data, method: tar }
