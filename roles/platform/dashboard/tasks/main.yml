---
# Deploy the home server dashboard: static HTML generator.
# The dashboard script runs every 15 minutes via systemd timer and
# auto-discovers what to render by reading the split inventory + each
# role's meta/install.yml (see role README for the contract).

- name: Install PyYAML for dashboard script
  become: true
  ansible.builtin.dnf:
    name: python3-pyyaml
    state: present

- name: Deploy dashboard generator script
  become: true
  ansible.builtin.copy:
    src: home-server-dashboard.py
    dest: /usr/local/bin/home-server-dashboard.py
    mode: "0755"

- name: Drop legacy /etc/home-server-dashboard.yaml (now auto-discovered from inventory)
  become: true
  ansible.builtin.file:
    path: /etc/home-server-dashboard.yaml
    state: absent

- name: Create dashboard output directory
  become: true
  ansible.builtin.file:
    path: /var/www/dashboard
    state: directory
    mode: "0755"

- name: Deploy dashboard generator systemd service
  become: true
  ansible.builtin.template:
    # Templated (not copied) because ExecStart embeds the on-host
    # inventory + roles paths, which differ per install user
    # (e.g. /home/ds/home-server/inventory vs /home/ansible/...).
    src: home-server-dashboard.service.j2
    dest: /etc/systemd/system/home-server-dashboard.service
    mode: "0644"

- name: Deploy dashboard generator systemd timer
  become: true
  ansible.builtin.copy:
    src: home-server-dashboard.timer
    dest: /etc/systemd/system/home-server-dashboard.timer
    mode: "0644"

- name: Reload systemd daemon
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Generate dashboard now
  become: true
  ansible.builtin.systemd_service:
    name: home-server-dashboard.service
    state: started

- name: Enable and start dashboard timer
  become: true
  ansible.builtin.systemd_service:
    name: home-server-dashboard.timer
    enabled: true
    state: started
