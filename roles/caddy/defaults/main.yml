# Container image — custom Caddy build with deSEC + Cloudflare +
# Hetzner DNS-01 plugins compiled in. See ../caddy-image/ for the
# Dockerfile + GitHub Actions workflow that publishes this tag.
caddy_image: "ghcr.io/luckynrslevin/caddy-acme:latest"

# Caddy listen port (unprivileged, mapped via firewall from 80)
caddy_listen_port: 9080

# Caddy HTTPS listen port (unprivileged, mapped via firewall from 443)
caddy_listen_port_https: 9443

# Domain name for the server (e.g. "myhome.dedyn.io"). Required —
# every reverse-proxy subdomain hangs off this. site.yml asserts it
# at the top of the play.
caddy_domain: ""

# Reverse proxy service definitions. Each entry creates a subdomain
# route: <subdomain>.<caddy_domain> → localhost:<port>.
#
# Example:
#   caddy_reverse_proxy_services:
#     - { subdomain: pihole, port: 8443, proto: https }
#     - { subdomain: syncthing, port: 8384, proto: https }
#     - { subdomain: photos, port: 3000 }
#     - { subdomain: paperless, port: 8000 }
caddy_reverse_proxy_services: []

# ACME provider for issuing real Let's Encrypt certificates via the
# DNS-01 challenge. Required — the role asserts it. One of:
#
#   "desec"      — Free *.dedyn.io subdomain at deSEC (recommended).
#   "cloudflare" — BYO domain hosted at Cloudflare DNS.
#   "hetzner"    — BYO domain hosted at Hetzner DNS.
#
# All three plugins are bundled in the custom Caddy image
# (ghcr.io/luckynrslevin/caddy-acme); switching is just an inventory
# change.
caddy_acme_provider: ""

# For provider == "desec": the dedyn.io subdomain (without the
# .dedyn.io suffix). Caddy issues a wildcard cert for
# *.<caddy_acme_subdomain>.dedyn.io.
caddy_acme_subdomain: ""

# For provider == "cloudflare" / "hetzner": the BYO apex zone
# (e.g. "example.com"). Caddy issues a wildcard cert for
# *.<caddy_acme_zone>.
caddy_acme_zone: ""

# API token for the chosen DNS provider. Vault-encrypt this in
# host_vars. Scope to the single zone / single record type when the
# provider supports it.
caddy_acme_token: ""
