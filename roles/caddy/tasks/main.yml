---

- name: Assert ACME provider is configured
  ansible.builtin.assert:
    that:
      - caddy_acme_provider in ['desec', 'cloudflare', 'hetzner']
      - caddy_acme_token | length > 0
    fail_msg: >-
      caddy_acme_provider must be one of desec / cloudflare / hetzner
      and caddy_acme_token must be set (vault-encrypted in host_vars).
      The platform issues real Let's Encrypt certs via DNS-01 — there
      is no internal-CA fallback.

- name: Ensure rootless user group exists
  ansible.builtin.group:
    name: webproxy
    gid: "{{ my_linux_users.webproxy.gid }}"
    state: present

- name: Ensure rootless user exists
  ansible.builtin.user:
    name: webproxy
    state: present
    uid: "{{ my_linux_users.webproxy.uid }}"
    group: webproxy
    create_home: true

- name: Enable linger for rootless user
  become: true
  ansible.builtin.command:
    cmd: "loginctl enable-linger webproxy"
  changed_when: false

- name: Enable podman auto-update timer for rootless user # noqa: no-changed-when
  become: true
  ansible.builtin.command:
    cmd: >
      sudo -u webproxy XDG_RUNTIME_DIR=/run/user/{{ my_linux_users.webproxy.uid }}
      DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ my_linux_users.webproxy.uid }}/bus
      systemctl --user enable --now podman-auto-update.timer
  changed_when: false

- name: Ensure dashboard output directory exists
  become: true
  ansible.builtin.file:
    path: /var/www/dashboard
    state: directory
    mode: "0755"
    setype: container_file_t

- name: Save current role path
  ansible.builtin.set_fact:
    caddy_role_path: "{{ role_path }}"

- name: Deploy caddy container using podman_quadlet
  ansible.builtin.include_role:
    name: luckynrslevin.podman_quadlet
  vars:
    podman_quadlet_app_name: caddy
    podman_quadlet_rootless_user_name: webproxy
    podman_quadlet_files_templates_src_path: "{{ caddy_role_path }}"
    podman_quadlet_file_names:
      - caddy.container.j2
      - caddy-data.volume
      - caddy-config.volume
      - caddy-etc.volume
    podman_quadlet_volumes_files_to_stage:
      - name: caddy-etc
        files:
          - { src: 'Caddyfile.j2', mode: '0644' }
    # Open the published ports in the firewall. Caddy now binds
    # 80/443 directly (see os-base: ip_unprivileged_port_start=80),
    # so no firewall NAT is needed — just ACCEPT rules for the
    # listening ports themselves. This also means pod-to-host
    # traffic (e.g. paperless to Nextcloud's OIDC endpoint) reaches
    # Caddy on the canonical port without any `:9443` workaround.
    podman_quadlet_firewall_ports:
      - "{{ caddy_listen_port }}/tcp"
      - "{{ caddy_listen_port_https }}/tcp"

- name: Reload Caddy configuration # noqa: no-changed-when
  become: true
  ansible.builtin.shell: >
    su - webproxy -c 'podman exec caddy caddy reload --config /etc/caddy/Caddyfile 2>&1'
  changed_when: false
  failed_when: false

- name: Register backup manifest
  ansible.builtin.set_fact:
    _backup_manifests: >-
      {{ _backup_manifests | default([]) +
         [backup_manifest | combine({'_role_name': role_name})] }}
  when: backup_manifest is defined
