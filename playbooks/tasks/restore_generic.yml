---
# Generic restore for one service, parameterised by {{ svc }}.
#
# Expected svc keys:
#   service_user   — Linux username (key into my_linux_users for UID)
#   service_unit   — systemd --user unit to stop/start
#   volumes[]      — list of {name, method, restore_opt_in?}
#   databases[]    — optional list of {container, db_user, db_name, method}
#   post_restore_tasks — optional role-relative path for post-restore hook
#   _role_name     — injected by the aggregation set_fact
#
# Reads from per-host NAS layout:
#   nas:/<vol>/backup-<host>/<app>/{tar,rsync,pgdump}/<volume_or_container>/

# --- Mount the host's NAS share ---
- name: "{{ svc._role_name | upper }}: mount NAS host share"
  block:
    - ansible.builtin.file:
        path: "{{ restore_root }}"
        state: directory
    - ansible.posix.mount:
        path: "{{ restore_root }}"
        src: "{{ nas_host }}:{{ nas_volume }}/backup-{{ inventory_hostname }}"
        fstype: nfs
        opts: "{{ nfs_opts }}"
        state: ephemeral

# --- Find latest tar backups ---
- name: "{{ svc._role_name | upper }}: find latest tar backups"
  ansible.builtin.shell: >
    ls -t {{ restore_root }}/{{ svc._role_name }}/{{ item.name }}/*.tar.gz | head -1
  register: _tar_latest
  loop: "{{ svc.volumes | selectattr('method', 'equalto', 'tar') | list }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

# --- Find latest pgdump backups ---
- name: "{{ svc._role_name | upper }}: find latest pgdump backups"
  ansible.builtin.shell: >
    ls -t {{ restore_root }}/{{ svc._role_name }}/{{ item.container }}/*.sql.gz | head -1
  register: _pgdump_latest
  loop: "{{ svc.databases | default([]) }}"
  loop_control:
    label: "{{ item.container }}"
  changed_when: false

# ===================================================================
# Image-version manifest check + pin
# -------------------------------------------------------------------
# The backup script captured {name, image-tag, image-digest} for each
# container running at backup time. Restoring volumes into a newer
# auto-pulled :latest image risks DB-schema-vs-binary mismatches.
#
# Default behaviour: pull the recorded digests and re-tag them as the
# current image name so the post-restore start picks up the
# backup-time version. Override with `-e restore_pin_images=false`
# (e.g. for a deliberate "restore into the newer version" path,
# accepting upgrade-on-first-start migrations).
# ===================================================================

- name: "{{ svc._role_name | upper }}: find latest image manifest"
  ansible.builtin.shell: >-
    ls -t {{ restore_root }}/{{ svc._role_name }}/images/*.json 2>/dev/null | head -1
  register: _manifest_path
  changed_when: false
  failed_when: false

- name: "{{ svc._role_name | upper }}: read image manifest"
  ansible.builtin.slurp:
    src: "{{ _manifest_path.stdout }}"
  register: _manifest_raw
  when: _manifest_path.stdout | length > 0

- name: "{{ svc._role_name | upper }}: parse image manifest"
  ansible.builtin.set_fact:
    _image_manifest: "{{ (_manifest_raw.content | b64decode | from_json).containers }}"
    _image_manifest_ts: "{{ (_manifest_raw.content | b64decode | from_json).timestamp }}"
  when: _manifest_path.stdout | length > 0

- name: "{{ svc._role_name | upper }}: warn when no manifest found"
  ansible.builtin.debug:
    msg: >-
      No image manifest found at
      {{ restore_root }}/{{ svc._role_name }}/images/.
      Backups predate PR #281 (capture step). Restore proceeds with
      whatever image is currently running — verify the data is
      compatible.
  when: _manifest_path.stdout | length == 0

- name: "{{ svc._role_name | upper }}: query current image digests for comparison"
  ansible.builtin.shell: |
    sudo -u {{ svc.service_user }} \
      XDG_RUNTIME_DIR=/run/user/{{ my_linux_users[svc.service_user].uid }} \
      podman inspect {{ item.name }} \
      --format '{% raw %}{{.ImageDigest}}{% endraw %}' 2>/dev/null
  loop: "{{ _image_manifest | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: _current_digests
  changed_when: false
  failed_when: false

- name: "{{ svc._role_name | upper }}: image manifest comparison"
  ansible.builtin.debug:
    msg: >-
      {{ item.0.name }}: backup={{ item.0.image_digest }} ·
      current={{ item.1.stdout if item.1.stdout else '(missing)' }} ·
      {{ 'MATCH' if item.1.stdout == item.0.image_digest else 'MISMATCH' }}
  loop: "{{ _image_manifest | default([]) | zip(_current_digests.results | default([])) | list }}"
  loop_control:
    label: "{{ item.0.name }}"
  when: _image_manifest is defined

# --- Stop the service (before pulling/tagging so nothing races) ---
- name: "{{ svc._role_name | upper }}: stop service"
  ansible.builtin.command:
    cmd: >
      sudo -u {{ svc.service_user }}
      XDG_RUNTIME_DIR=/run/user/{{ my_linux_users[svc.service_user].uid }}
      DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ my_linux_users[svc.service_user].uid }}/bus
      systemctl --user stop {{ svc.service_unit }}
  changed_when: false
  failed_when: false

# Pin: pull each recorded digest + retag as the current image name.
# Iterate every manifest entry — the shell short-circuits when the
# digest already matches (a no-op match logs "already pinned" and
# moves on). Pulling an already-cached digest is fast and idempotent.
#
# `podman tag` overwrites the existing tag in local storage; the next
# container start uses the now-tagged digest. Auto-update will re-bump
# to :latest at its next tick — operator should pause auto-update if
# they want the pin to persist beyond the immediate restart.
- name: "{{ svc._role_name | upper }}: pin images to backup-time digests"
  ansible.builtin.shell: |
    set -eu
    REPO='{{ item.image | regex_replace(":[^:/]+$", "") }}'
    DIGEST='{{ item.image_digest }}'
    TAGGED='{{ item.image }}'
    SUDO='sudo -u {{ svc.service_user }} XDG_RUNTIME_DIR=/run/user/{{ my_linux_users[svc.service_user].uid }}'
    CURRENT=$($SUDO podman inspect {{ item.name }} --format '{% raw %}{{.ImageDigest}}{% endraw %}' 2>/dev/null || echo '')
    if [ "$CURRENT" = "$DIGEST" ]; then
        echo "already pinned ({{ item.name }} @ $DIGEST)"
        exit 0
    fi
    echo "pinning {{ item.name }}: $CURRENT -> $DIGEST"
    $SUDO podman pull "${REPO}@${DIGEST}"
    $SUDO podman tag  "${REPO}@${DIGEST}" "${TAGGED}"
  loop: "{{ _image_manifest | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - restore_pin_images | default(true)
    - _image_manifest is defined
  register: _pin_result
  changed_when: '"pinning" in _pin_result.stdout'
  failed_when: false

# --- Restore tar volumes ---
- name: "{{ svc._role_name | upper }}: restore tar volume {{ item.item.name }}"
  ansible.builtin.shell: |
    cd /tmp
    sudo -u {{ svc.service_user }} podman volume rm {{ item.item.name }} || true
    sudo -u {{ svc.service_user }} podman volume create {{ item.item.name }}
    gunzip -c "{{ item.stdout }}" | \
        sudo -u {{ svc.service_user }} podman volume import {{ item.item.name }} -
  loop: "{{ _tar_latest.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"

# --- Restore rsync volumes (skip opt-in ones) ---
- name: "{{ svc._role_name | upper }}: rsync restore {{ item.name }}"
  ansible.builtin.shell: |
    cd /tmp
    MP=$(sudo -u {{ svc.service_user }} podman volume inspect {{ item.name }} \
        --format='{% raw %}{{.Mountpoint}}{% endraw %}')
    sudo -u {{ svc.service_user }} podman unshare rsync -a --delete \
        --no-owner --no-group --numeric-ids \
        "{{ restore_root }}/{{ svc._role_name }}/{{ item.name }}/" "$MP/"
  loop: >-
    {{ svc.volumes
       | selectattr('method', 'equalto', 'rsync')
       | rejectattr('restore_opt_in', 'defined')
       | list }}
  loop_control:
    label: "{{ item.name }}"

# --- Start the service ---
- name: "{{ svc._role_name | upper }}: start service"
  ansible.builtin.command:
    cmd: >
      sudo -u {{ svc.service_user }}
      XDG_RUNTIME_DIR=/run/user/{{ my_linux_users[svc.service_user].uid }}
      DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ my_linux_users[svc.service_user].uid }}/bus
      systemctl --user start {{ svc.service_unit }}
  changed_when: false

# --- Run post-restore hook if defined ---
- name: "{{ svc._role_name | upper }}: run post-restore tasks"
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/../roles/{{ svc._role_name }}/tasks/{{ svc.post_restore_tasks }}"
  when: svc.post_restore_tasks is defined

# --- User-facing secret drift warning ---
# Restore brings back an older volume. If the user changed their admin
# password (or other user-facing secret) via the app UI between the
# snapshot time and the restore, the restored DB has the OLDER value.
# The password they remember no longer works; inventory's bootstrap
# value might match the restored DB, but only if the user never changed
# it post-install. Flag this so the operator knows to verify before
# declaring the restore successful.
- name: "{{ svc._role_name | upper }}: load role meta for user-facing scan"
  ansible.builtin.include_vars:
    file: "{{ lookup('ansible.builtin.first_found', [
                playbook_dir + '/../roles/platform/' + svc._role_name + '/meta/install.yml',
                playbook_dir + '/../roles/apps/'     + svc._role_name + '/meta/install.yml']) }}"
    name: "_meta_{{ svc._role_name | replace('-', '_') }}"
  failed_when: false

- name: "{{ svc._role_name | upper }}: identify user-facing secrets"
  ansible.builtin.set_fact:
    _user_facing_secrets: >-
      {{ (lookup('vars', '_meta_' + (svc._role_name | replace('-', '_')), default={})
          .get('inventory_vars') or [])
         | selectattr('user_facing', 'defined') | selectattr('user_facing')
         | map(attribute='name') | list }}

- name: "{{ svc._role_name | upper }}: warn about user-facing secret drift"
  ansible.builtin.debug:
    msg: |
      Restore brought back an older {{ svc._role_name }} volume. Heads-up —
      the restored DB / config still carries whatever value these
      user-facing secrets had at snapshot time:
        {{ _user_facing_secrets | join(', ') }}
      If the user changed any of those via the app UI between then
      and now, the password they currently remember will NOT work.
      Either log in with the snapshot-time value, or reset via the
      app's password-reset mechanism (e.g. `manage.py changepassword`,
      `occ user:resetpassword`, `pihole -a -p`).
      Inventory was not modified; `homeserver.sh secret <var>` still
      returns the install-time bootstrap value.
  when: _user_facing_secrets | default([]) | length > 0

# --- Unmount the host's NAS share ---
- name: "{{ svc._role_name | upper }}: unmount NAS host share"
  ansible.posix.mount:
    path: "{{ restore_root }}"
    state: unmounted
